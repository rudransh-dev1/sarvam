<!doctype html>
<!--
  Behavioural test for the mock web app in js/weblab.js.
  The frame is intentionally NOT sandboxed here so the test can drive it; the shipped lab
  uses sandbox="allow-scripts", so the same code runs with a unique origin.
  Serve the site and open /test/weblab.test.html, or run: node test/weblab-chrome.mjs
-->
<html lang="en">
<head><meta charset="utf-8" /><title>weblab-test</title></head>
<body>
<div id="result">running</div>
<iframe id="lab" style="width:900px;height:600px"></iframe>
<script type="module">
  import { buildApp } from '../js/weblab.js';
  import { lessonById } from '../js/data/curriculum.js';

  const spec = lessonById('p3-http').lab.app;
  const frame = document.getElementById('lab');
  const out = document.getElementById('result');
  const results = [];
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const d = () => frame.contentDocument;
  const text = () => d().body.innerText;

  const boot = () =>
    new Promise((resolve) => {
      frame.addEventListener('load', () => resolve(), { once: true });
      frame.srcdoc = buildApp(spec);
    });

  const nav = async (path) => {
    frame.contentWindow.location.hash = '#' + path;
    await wait(160);
  };

  async function main() {
    await boot();
    await wait(120);

    results.push(['boot', text().includes('Nimbus')]);
    results.push(['session exposed', Boolean(frame.contentWindow.__adminSession)]);
    out.textContent = 'stepped';

    await nav('/note?id=9');
    results.push(['idor note', text().includes('SARVAM{idor_is_not_a_feature}')]);

    await nav('/api/note?id=9');
    results.push(['idor api', text().includes('SARVAM{idor_is_not_a_feature}')]);

    await nav('/download?file=../private/backup-2026-11-04.txt');
    results.push(['traversal', text().includes('SARVAM{traversal_reads_anything}')]);

    await nav('/download?file=readme.txt');
    results.push(['whitelisted file', text().includes('Nimbus file store')]);

    await nav('/download?file=nope.txt');
    results.push(['missing file 404', text().includes('404')]);

    await nav('/feedback');
    d().getElementById('msg').value = '<img src=x onerror="document.body.innerText=window.__adminSession.key">';
    d().getElementById('fb').dispatchEvent(new frame.contentWindow.Event('submit', { cancelable: true, bubbles: true }));
    await wait(500);
    results.push(['xss executes', text().includes('SARVAM{xss_runs_in_my_browser}')]);

    await boot();
    await wait(120);
    await nav('/feedback');
    d().getElementById('msg').value = '<script>document.body.innerText="script-ran"<\/script>';
    d().getElementById('fb').dispatchEvent(new frame.contentWindow.Event('submit', { cancelable: true, bubbles: true }));
    await wait(300);
    results.push(['script tag inert', !text().includes('script-ran')]);

    const failed = results.filter(([, ok]) => !ok).map(([name]) => name);
    out.textContent = failed.length ? 'FAIL ' + failed.join(', ') : 'PASS';
    document.title = failed.length ? 'FAIL' : 'PASS';
  }

  main().catch((e) => {
    out.textContent = 'THROW ' + e.message;
    document.title = 'FAIL';
  });
</script>
</body>
</html>
