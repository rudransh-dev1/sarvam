<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sarvam · Zero to Cyber</title>
<meta name="description" content="Sarvam: a guided, gated cybersecurity curriculum with hands-on labs in the browser. Learn a concept, prove it in the lab, remember it with spaced review." />
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-mark">स</span>
    <span class="brand-text">SARVAM<small>zero to cyber</small></span>
  </a>
  <nav class="topnav">
    <a href="#/" data-nav="path">Curriculum</a>
    <a href="#/review" data-nav="review">Review <span class="pill" id="due-pill">0</span></a>
    <a href="#/progress" data-nav="progress">Progress</a>
  </nav>
  <div class="stats">
    <div class="stat"><span id="stat-xp">0</span><small>XP</small></div>
    <div class="stat"><span id="stat-streak">0</span><small>day streak</small></div>
    <div class="stat"><span id="stat-done">0/0</span><small>labs passed</small></div>
  </div>
</header>

<main id="app"></main>

<footer class="foot">
  <span>Sarvam · built for one student who wants to actually remember this stuff.</span>
  <span class="foot-links">
    <a href="https://github.com/rudransh-dev1" target="_blank" rel="noopener">github</a>
    <a href="#/about">how this works</a>
  </span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
